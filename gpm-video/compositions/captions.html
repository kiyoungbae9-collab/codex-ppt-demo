<template>
  <style>

    }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="555.9333">
    <div id="cg001" class="cg clip" data-start="2.379" data-duration="2.925"><span class="cbox" id="cg001-t">Good morning, distinguished representatives of the</span></div>
    <div id="cg002" class="cg clip" data-start="5.304" data-duration="2.841"><span class="cbox" id="cg002-t">Chamber of Commerce and business leaders.</span></div>
    <div id="cg003" class="cg clip" data-start="8.145" data-duration="2.288"><span class="cbox" id="cg003-t">Thank you for this opportunity.</span></div>
    <div id="cg004" class="cg clip" data-start="10.433" data-duration="1.7"><span class="cbox" id="cg004-t">Today, I would like to introduce</span></div>
    <div id="cg005" class="cg clip" data-start="12.133" data-duration="2.65"><span class="cbox" id="cg005-t">a practical business partnership between Korea</span></div>
    <div id="cg006" class="cg clip" data-start="14.783" data-duration="1.18"><span class="cbox" id="cg006-t">and Ghana.</span></div>
    <div id="cg007" class="cg clip" data-start="15.963" data-duration="2.3"><span class="cbox" id="cg007-t">Korea has industrial equipment,</span></div>
    <div id="cg008" class="cg clip" data-start="18.263" data-duration="3.966"><span class="cbox" id="cg008-t">manufacturing experience, and technical expertise.</span></div>
    <div id="cg009" class="cg clip" data-start="22.229" data-duration="1.95"><span class="cbox" id="cg009-t">Ghana has entrepreneurs,</span></div>
    <div id="cg010" class="cg clip" data-start="24.179" data-duration="1.825"><span class="cbox" id="cg010-t">growing business ambitions,</span></div>
    <div id="cg011" class="cg clip" data-start="26.004" data-duration="3.382"><span class="cbox" id="cg011-t">and opportunities to develop local manufacturing.</span></div>
    <div id="cg012" class="cg clip" data-start="29.386" data-duration="2.15"><span class="cbox" id="cg012-t">Global Partner Market aims to connect</span></div>
    <div id="cg013" class="cg clip" data-start="31.536" data-duration="2.25"><span class="cbox" id="cg013-t">these capabilities and turn them into</span></div>
    <div id="cg014" class="cg clip" data-start="33.786" data-duration="2.15"><span class="cbox" id="cg014-t">real business projects.</span></div>
    <div id="cg015" class="cg clip" data-start="35.936" data-duration="1.375"><span class="cbox" id="cg015-t">Our goal is not simply to</span></div>
    <div id="cg016" class="cg clip" data-start="37.311" data-duration="1.556"><span class="cbox" id="cg016-t">sell machines.</span></div>
    <div id="cg017" class="cg clip" data-start="38.867" data-duration="1.825"><span class="cbox" id="cg017-t">It is to help create sustainable</span></div>
    <div id="cg018" class="cg clip" data-start="40.692" data-duration="2.639"><span class="cbox" id="cg018-t">manufacturing opportunities together.</span></div>
    <div id="cg019" class="cg clip" data-start="45.568" data-duration="2.206"><span class="cbox" id="cg019-t">Let me begin with a question.</span></div>
    <div id="cg020" class="cg clip" data-start="47.774" data-duration="1.3"><span class="cbox" id="cg020-t">What product would you like to</span></div>
    <div id="cg021" class="cg clip" data-start="49.074" data-duration="2.175"><span class="cbox" id="cg021-t">manufacture in Ghana if you could</span></div>
    <div id="cg022" class="cg clip" data-start="51.249" data-duration="3.309"><span class="cbox" id="cg022-t">find suitable equipment and technical support?</span></div>
    <div id="cg023" class="cg clip" data-start="54.558" data-duration="1.3"><span class="cbox" id="cg023-t">For some businesses,</span></div>
    <div id="cg024" class="cg clip" data-start="55.858" data-duration="2.847"><span class="cbox" id="cg024-t">the opportunity may be hygiene products.</span></div>
    <div id="cg025" class="cg clip" data-start="58.705" data-duration="2.63"><span class="cbox" id="cg025-t">For others, pharmaceutical manufacturing,</span></div>
    <div id="cg026" class="cg clip" data-start="61.335" data-duration="2.476"><span class="cbox" id="cg026-t">plastic products, or packaging.</span></div>
    <div id="cg027" class="cg clip" data-start="63.811" data-duration="3.075"><span class="cbox" id="cg027-t">Starting a manufacturing project requires more</span></div>
    <div id="cg028" class="cg clip" data-start="66.886" data-duration="1.674"><span class="cbox" id="cg028-t">than buying equipment.</span></div>
    <div id="cg029" class="cg clip" data-start="68.56" data-duration="1.5"><span class="cbox" id="cg029-t">You need market demand,</span></div>
    <div id="cg030" class="cg clip" data-start="70.06" data-duration="1.35"><span class="cbox" id="cg030-t">the right technology,</span></div>
    <div id="cg031" class="cg clip" data-start="71.41" data-duration="2.834"><span class="cbox" id="cg031-t">trained people, and a suitable factory.</span></div>
    <div id="cg032" class="cg clip" data-start="74.244" data-duration="1.75"><span class="cbox" id="cg032-t">We believe there is an opportunity</span></div>
    <div id="cg033" class="cg clip" data-start="75.994" data-duration="2.925"><span class="cbox" id="cg033-t">to connect Korean industrial resources with</span></div>
    <div id="cg034" class="cg clip" data-start="78.919" data-duration="3.15"><span class="cbox" id="cg034-t">Ghanaian entrepreneurs who already understand their</span></div>
    <div id="cg035" class="cg clip" data-start="82.069" data-duration="1.586"><span class="cbox" id="cg035-t">local markets.</span></div>
    <div id="cg036" class="cg clip" data-start="83.655" data-duration="2.999"><span class="cbox" id="cg036-t">The starting point is your business idea.</span></div>
    <div id="cg037" class="cg clip" data-start="88.812" data-duration="1.325"><span class="cbox" id="cg037-t">This is the role of Global</span></div>
    <div id="cg038" class="cg clip" data-start="90.137" data-duration="3.065"><span class="cbox" id="cg038-t">Partner Market, or GPM.</span></div>
    <div id="cg039" class="cg clip" data-start="93.202" data-duration="1.45"><span class="cbox" id="cg039-t">On the Korean side,</span></div>
    <div id="cg040" class="cg clip" data-start="94.652" data-duration="2.44"><span class="cbox" id="cg040-t">we seek suitable equipment suppliers,</span></div>
    <div id="cg041" class="cg clip" data-start="97.092" data-duration="3.718"><span class="cbox" id="cg041-t">manufacturing technologies, and specialist companies.</span></div>
    <div id="cg042" class="cg clip" data-start="100.81" data-duration="1.575"><span class="cbox" id="cg042-t">On the Ghanaian side,</span></div>
    <div id="cg043" class="cg clip" data-start="102.385" data-duration="2.95"><span class="cbox" id="cg043-t">we work to identify manufacturing demand,</span></div>
    <div id="cg044" class="cg clip" data-start="105.335" data-duration="1.59"><span class="cbox" id="cg044-t">potential local partners,</span></div>
    <div id="cg045" class="cg clip" data-start="106.925" data-duration="1.952"><span class="cbox" id="cg045-t">and project requirements.</span></div>
    <div id="cg046" class="cg clip" data-start="108.877" data-duration="2.5"><span class="cbox" id="cg046-t">GPM connects these two sides through</span></div>
    <div id="cg047" class="cg clip" data-start="111.377" data-duration="2.625"><span class="cbox" id="cg047-t">equipment matching, technical review,</span></div>
    <div id="cg048" class="cg clip" data-start="114.002" data-duration="3.574"><span class="cbox" id="cg048-t">business planning, and implementation coordination.</span></div>
    <div id="cg049" class="cg clip" data-start="117.576" data-duration="1.7"><span class="cbox" id="cg049-t">We are proposing a platform for</span></div>
    <div id="cg050" class="cg clip" data-start="119.276" data-duration="2.092"><span class="cbox" id="cg050-t">practical cooperation.</span></div>
    <div id="cg051" class="cg clip" data-start="121.368" data-duration="2.815"><span class="cbox" id="cg051-t">Each project must be evaluated separately,</span></div>
    <div id="cg052" class="cg clip" data-start="124.183" data-duration="3.227"><span class="cbox" id="cg052-t">with the relevant suppliers and local partners.</span></div>
    <div id="cg053" class="cg clip" data-start="127.41" data-duration="1.675"><span class="cbox" id="cg053-t">Our value is in helping the</span></div>
    <div id="cg054" class="cg clip" data-start="129.085" data-duration="3.19"><span class="cbox" id="cg054-t">right companies and technologies come together.</span></div>
    <div id="cg055" class="cg clip" data-start="134.433" data-duration="1.8"><span class="cbox" id="cg055-t">We are focusing on four groups</span></div>
    <div id="cg056" class="cg clip" data-start="136.233" data-duration="2.531"><span class="cbox" id="cg056-t">of manufacturing opportunities.</span></div>
    <div id="cg057" class="cg clip" data-start="138.764" data-duration="2.15"><span class="cbox" id="cg057-t">First, pharmaceutical equipment,</span></div>
    <div id="cg058" class="cg clip" data-start="140.914" data-duration="2.275"><span class="cbox" id="cg058-t">including sterile vial powder filling and</span></div>
    <div id="cg059" class="cg clip" data-start="143.189" data-duration="1.557"><span class="cbox" id="cg059-t">capping systems.</span></div>
    <div id="cg060" class="cg clip" data-start="144.746" data-duration="3.375"><span class="cbox" id="cg060-t">These projects require particularly careful technical,</span></div>
    <div id="cg061" class="cg clip" data-start="148.121" data-duration="2.78"><span class="cbox" id="cg061-t">quality, and regulatory review.</span></div>
    <div id="cg062" class="cg clip" data-start="150.901" data-duration="2.096"><span class="cbox" id="cg062-t">Second, hygiene products.</span></div>
    <div id="cg063" class="cg clip" data-start="152.997" data-duration="1.425"><span class="cbox" id="cg063-t">We are looking at three distinct</span></div>
    <div id="cg064" class="cg clip" data-start="154.422" data-duration="2.275"><span class="cbox" id="cg064-t">categories: baby diapers,</span></div>
    <div id="cg065" class="cg clip" data-start="156.697" data-duration="3.509"><span class="cbox" id="cg065-t">adult diapers, and feminine sanitary pads.</span></div>
    <div id="cg066" class="cg clip" data-start="160.206" data-duration="3.995"><span class="cbox" id="cg066-t">Each requires its own suitable manufacturing equipment.</span></div>
    <div id="cg067" class="cg clip" data-start="164.201" data-duration="2.885"><span class="cbox" id="cg067-t">Third, plastic injection molding equipment,</span></div>
    <div id="cg068" class="cg clip" data-start="167.086" data-duration="2.1"><span class="cbox" id="cg068-t">including machines, molds,</span></div>
    <div id="cg069" class="cg clip" data-start="169.186" data-duration="2.008"><span class="cbox" id="cg069-t">and related automation.</span></div>
    <div id="cg070" class="cg clip" data-start="171.194" data-duration="2.375"><span class="cbox" id="cg070-t">And fourth, other industrial equipment such</span></div>
    <div id="cg071" class="cg clip" data-start="173.569" data-duration="2.711"><span class="cbox" id="cg071-t">as packaging and processing machinery.</span></div>
    <div id="cg072" class="cg clip" data-start="176.28" data-duration="1.15"><span class="cbox" id="cg072-t">We would like to learn which</span></div>
    <div id="cg073" class="cg clip" data-start="177.43" data-duration="2.2"><span class="cbox" id="cg073-t">of these sectors is most relevant</span></div>
    <div id="cg074" class="cg clip" data-start="179.63" data-duration="1.352"><span class="cbox" id="cg074-t">to your business.</span></div>
    <div id="cg075" class="cg clip" data-start="183.196" data-duration="2.125"><span class="cbox" id="cg075-t">Purchasing a machine is only one</span></div>
    <div id="cg076" class="cg clip" data-start="185.321" data-duration="2.804"><span class="cbox" id="cg076-t">part of starting a manufacturing business.</span></div>
    <div id="cg077" class="cg clip" data-start="188.125" data-duration="2.125"><span class="cbox" id="cg077-t">A company also needs to understand</span></div>
    <div id="cg078" class="cg clip" data-start="190.25" data-duration="3.05"><span class="cbox" id="cg078-t">installation requirements, utilities,</span></div>
    <div id="cg079" class="cg clip" data-start="193.3" data-duration="2.525"><span class="cbox" id="cg079-t">operating procedures, quality control,</span></div>
    <div id="cg080" class="cg clip" data-start="195.825" data-duration="1.489"><span class="cbox" id="cg080-t">and maintenance.</span></div>
    <div id="cg081" class="cg clip" data-start="197.314" data-duration="2.625"><span class="cbox" id="cg081-t">Our proposed model connects equipment sourcing</span></div>
    <div id="cg082" class="cg clip" data-start="199.939" data-duration="3.836"><span class="cbox" id="cg082-t">with engineering review and practical workforce training.</span></div>
    <div id="cg083" class="cg clip" data-start="203.775" data-duration="1.7"><span class="cbox" id="cg083-t">Depending on the project,</span></div>
    <div id="cg084" class="cg clip" data-start="205.475" data-duration="2.825"><span class="cbox" id="cg084-t">Korean specialists and local technical partners</span></div>
    <div id="cg085" class="cg clip" data-start="208.3" data-duration="2.15"><span class="cbox" id="cg085-t">may support equipment inspection,</span></div>
    <div id="cg086" class="cg clip" data-start="210.45" data-duration="2.21"><span class="cbox" id="cg086-t">installation planning, commissioning,</span></div>
    <div id="cg087" class="cg clip" data-start="212.66" data-duration="1.184"><span class="cbox" id="cg087-t">and training.</span></div>
    <div id="cg088" class="cg clip" data-start="213.844" data-duration="2.375"><span class="cbox" id="cg088-t">The objective is straightforward:</span></div>
    <div id="cg089" class="cg clip" data-start="216.219" data-duration="1.725"><span class="cbox" id="cg089-t">to help a local business move</span></div>
    <div id="cg090" class="cg clip" data-start="217.944" data-duration="3.155"><span class="cbox" id="cg090-t">toward an operational manufacturing facility,</span></div>
    <div id="cg091" class="cg clip" data-start="221.099" data-duration="2.0"><span class="cbox" id="cg091-t">rather than receive equipment without the</span></div>
    <div id="cg092" class="cg clip" data-start="223.099" data-duration="1.952"><span class="cbox" id="cg092-t">knowledge needed to use it.</span></div>
    <div id="cg093" class="cg clip" data-start="227.41" data-duration="1.7"><span class="cbox" id="cg093-t">Let me explain how a project</span></div>
    <div id="cg094" class="cg clip" data-start="229.11" data-duration="1.591"><span class="cbox" id="cg094-t">can move forward.</span></div>
    <div id="cg095" class="cg clip" data-start="230.701" data-duration="2.65"><span class="cbox" id="cg095-t">We begin by identifying equipment and</span></div>
    <div id="cg096" class="cg clip" data-start="233.351" data-duration="2.469"><span class="cbox" id="cg096-t">reviewing its technical condition.</span></div>
    <div id="cg097" class="cg clip" data-start="235.82" data-duration="2.4"><span class="cbox" id="cg097-t">Next, we match potential equipment with</span></div>
    <div id="cg098" class="cg clip" data-start="238.22" data-duration="2.467"><span class="cbox" id="cg098-t">the needs of a Ghanaian business.</span></div>
    <div id="cg099" class="cg clip" data-start="240.687" data-duration="1.8"><span class="cbox" id="cg099-t">Then we assess feasibility,</span></div>
    <div id="cg100" class="cg clip" data-start="242.487" data-duration="1.65"><span class="cbox" id="cg100-t">including the factory site,</span></div>
    <div id="cg101" class="cg clip" data-start="244.137" data-duration="2.55"><span class="cbox" id="cg101-t">utilities, maintenance requirements,</span></div>
    <div id="cg102" class="cg clip" data-start="246.687" data-duration="2.674"><span class="cbox" id="cg102-t">investment and operating conditions.</span></div>
    <div id="cg103" class="cg clip" data-start="249.361" data-duration="1.22"><span class="cbox" id="cg103-t">If the parties agree,</span></div>
    <div id="cg104" class="cg clip" data-start="250.581" data-duration="2.2"><span class="cbox" id="cg104-t">the project can move to contracting,</span></div>
    <div id="cg105" class="cg clip" data-start="252.781" data-duration="2.635"><span class="cbox" id="cg105-t">relocation, installation, commissioning,</span></div>
    <div id="cg106" class="cg clip" data-start="255.416" data-duration="1.252"><span class="cbox" id="cg106-t">and training.</span></div>
    <div id="cg107" class="cg clip" data-start="256.668" data-duration="3.325"><span class="cbox" id="cg107-t">Finally, production performance and operational readiness</span></div>
    <div id="cg108" class="cg clip" data-start="259.993" data-duration="1.33"><span class="cbox" id="cg108-t">are reviewed.</span></div>
    <div id="cg109" class="cg clip" data-start="261.323" data-duration="3.358"><span class="cbox" id="cg109-t">These stages are not automatic promises.</span></div>
    <div id="cg110" class="cg clip" data-start="264.681" data-duration="2.375"><span class="cbox" id="cg110-t">They are checkpoints intended to support</span></div>
    <div id="cg111" class="cg clip" data-start="267.056" data-duration="2.4"><span class="cbox" id="cg111-t">better decisions before a company makes</span></div>
    <div id="cg112" class="cg clip" data-start="269.456" data-duration="1.761"><span class="cbox" id="cg112-t">a major commitment.</span></div>
    <div id="cg113" class="cg clip" data-start="273.468" data-duration="2.425"><span class="cbox" id="cg113-t">Another important part of our approach</span></div>
    <div id="cg114" class="cg clip" data-start="275.893" data-duration="3.583"><span class="cbox" id="cg114-t">is organizing industrial equipment information.</span></div>
    <div id="cg115" class="cg clip" data-start="279.476" data-duration="2.6"><span class="cbox" id="cg115-t">When considering equipment from another country,</span></div>
    <div id="cg116" class="cg clip" data-start="282.076" data-duration="1.675"><span class="cbox" id="cg116-t">business owners need more than a</span></div>
    <div id="cg117" class="cg clip" data-start="283.751" data-duration="1.972"><span class="cbox" id="cg117-t">photograph and a price.</span></div>
    <div id="cg118" class="cg clip" data-start="285.723" data-duration="2.325"><span class="cbox" id="cg118-t">They need technical specifications,</span></div>
    <div id="cg119" class="cg clip" data-start="288.048" data-duration="3.665"><span class="cbox" id="cg119-t">equipment condition, maintenance history where available,</span></div>
    <div id="cg120" class="cg clip" data-start="291.713" data-duration="3.571"><span class="cbox" id="cg120-t">and information about installation and relocation.</span></div>
    <div id="cg121" class="cg clip" data-start="295.284" data-duration="3.325"><span class="cbox" id="cg121-t">GPM proposes to organize these details</span></div>
    <div id="cg122" class="cg clip" data-start="298.609" data-duration="2.325"><span class="cbox" id="cg122-t">in a digital equipment catalog that</span></div>
    <div id="cg123" class="cg clip" data-start="300.934" data-duration="3.986"><span class="cbox" id="cg123-t">supports discussions between suppliers and potential buyers.</span></div>
    <div id="cg124" class="cg clip" data-start="304.92" data-duration="1.675"><span class="cbox" id="cg124-t">The interface shown here is a</span></div>
    <div id="cg125" class="cg clip" data-start="306.595" data-duration="2.67"><span class="cbox" id="cg125-t">conceptual model, not a confirmed list</span></div>
    <div id="cg126" class="cg clip" data-start="309.265" data-duration="2.397"><span class="cbox" id="cg126-t">of machines for immediate sale.</span></div>
    <div id="cg127" class="cg clip" data-start="311.662" data-duration="3.075"><span class="cbox" id="cg127-t">Better information helps both sides determine</span></div>
    <div id="cg128" class="cg clip" data-start="314.737" data-duration="3.543"><span class="cbox" id="cg128-t">whether an opportunity deserves further investigation.</span></div>
    <div id="cg129" class="cg clip" data-start="320.454" data-duration="3.475"><span class="cbox" id="cg129-t">We understand that manufacturing investment requires</span></div>
    <div id="cg130" class="cg clip" data-start="323.929" data-duration="1.718"><span class="cbox" id="cg130-t">careful decisions.</span></div>
    <div id="cg131" class="cg clip" data-start="325.647" data-duration="1.95"><span class="cbox" id="cg131-t">A machine may be technically functional</span></div>
    <div id="cg132" class="cg clip" data-start="327.597" data-duration="2.575"><span class="cbox" id="cg132-t">but unsuitable for the local factory,</span></div>
    <div id="cg133" class="cg clip" data-start="330.172" data-duration="2.725"><span class="cbox" id="cg133-t">raw materials, production requirements,</span></div>
    <div id="cg134" class="cg clip" data-start="332.897" data-duration="1.776"><span class="cbox" id="cg134-t">or market conditions.</span></div>
    <div id="cg135" class="cg clip" data-start="334.673" data-duration="1.85"><span class="cbox" id="cg135-t">That is why we propose reviewing</span></div>
    <div id="cg136" class="cg clip" data-start="336.523" data-duration="2.625"><span class="cbox" id="cg136-t">six essential areas before major commitments</span></div>
    <div id="cg137" class="cg clip" data-start="339.148" data-duration="2.25"><span class="cbox" id="cg137-t">are made: market demand,</span></div>
    <div id="cg138" class="cg clip" data-start="341.398" data-duration="3.65"><span class="cbox" id="cg138-t">equipment suitability, investment and operating costs,</span></div>
    <div id="cg139" class="cg clip" data-start="345.048" data-duration="2.9"><span class="cbox" id="cg139-t">factory infrastructure, workforce capability,</span></div>
    <div id="cg140" class="cg clip" data-start="347.948" data-duration="2.297"><span class="cbox" id="cg140-t">and regulatory requirements.</span></div>
    <div id="cg141" class="cg clip" data-start="350.245" data-duration="2.025"><span class="cbox" id="cg141-t">For pharmaceutical projects,</span></div>
    <div id="cg142" class="cg clip" data-start="352.27" data-duration="4.178"><span class="cbox" id="cg142-t">quality and licensing requirements are particularly important.</span></div>
    <div id="cg143" class="cg clip" data-start="356.448" data-duration="1.225"><span class="cbox" id="cg143-t">We do not want to promise</span></div>
    <div id="cg144" class="cg clip" data-start="357.673" data-duration="3.848"><span class="cbox" id="cg144-t">an investment return without reliable evidence.</span></div>
    <div id="cg145" class="cg clip" data-start="361.521" data-duration="1.675"><span class="cbox" id="cg145-t">We want to help identify which</span></div>
    <div id="cg146" class="cg clip" data-start="363.196" data-duration="3.368"><span class="cbox" id="cg146-t">opportunities are worth evaluating further.</span></div>
    <div id="cg147" class="cg clip" data-start="368.754" data-duration="4.221"><span class="cbox" id="cg147-t">Successful cooperation requires clear responsibilities.</span></div>
    <div id="cg148" class="cg clip" data-start="372.975" data-duration="3.3"><span class="cbox" id="cg148-t">Korean partners may provide industrial equipment,</span></div>
    <div id="cg149" class="cg clip" data-start="376.275" data-duration="3.07"><span class="cbox" id="cg149-t">technical documentation, engineering support,</span></div>
    <div id="cg150" class="cg clip" data-start="379.345" data-duration="1.218"><span class="cbox" id="cg150-t">and training.</span></div>
    <div id="cg151" class="cg clip" data-start="380.563" data-duration="3.275"><span class="cbox" id="cg151-t">Ghanaian manufacturers and investors bring local</span></div>
    <div id="cg152" class="cg clip" data-start="383.838" data-duration="2.45"><span class="cbox" id="cg152-t">market knowledge, project sites,</span></div>
    <div id="cg153" class="cg clip" data-start="386.288" data-duration="3.177"><span class="cbox" id="cg153-t">business operations, and investment decisions.</span></div>
    <div id="cg154" class="cg clip" data-start="389.465" data-duration="2.65"><span class="cbox" id="cg154-t">GPM aims to connect the parties</span></div>
    <div id="cg155" class="cg clip" data-start="392.115" data-duration="1.875"><span class="cbox" id="cg155-t">and coordinate the early stages of</span></div>
    <div id="cg156" class="cg clip" data-start="393.99" data-duration="1.62"><span class="cbox" id="cg156-t">project development.</span></div>
    <div id="cg157" class="cg clip" data-start="395.61" data-duration="2.95"><span class="cbox" id="cg157-t">Chambers of Commerce and relevant institutions</span></div>
    <div id="cg158" class="cg clip" data-start="398.56" data-duration="2.925"><span class="cbox" id="cg158-t">can also help businesses identify potential</span></div>
    <div id="cg159" class="cg clip" data-start="401.485" data-duration="3.451"><span class="cbox" id="cg159-t">partners and opportunities for further discussion.</span></div>
    <div id="cg160" class="cg clip" data-start="404.936" data-duration="3.031"><span class="cbox" id="cg160-t">This is a proposed cooperation structure.</span></div>
    <div id="cg161" class="cg clip" data-start="407.967" data-duration="2.0"><span class="cbox" id="cg161-t">Actual roles, contracts,</span></div>
    <div id="cg162" class="cg clip" data-start="409.967" data-duration="2.55"><span class="cbox" id="cg162-t">and responsibilities must be agreed upon</span></div>
    <div id="cg163" class="cg clip" data-start="412.517" data-duration="2.015"><span class="cbox" id="cg163-t">by the participating companies.</span></div>
    <div id="cg164" class="cg clip" data-start="416.931" data-duration="1.925"><span class="cbox" id="cg164-t">We suggest beginning with a focused</span></div>
    <div id="cg165" class="cg clip" data-start="418.856" data-duration="1.639"><span class="cbox" id="cg165-t">pilot project.</span></div>
    <div id="cg166" class="cg clip" data-start="420.495" data-duration="1.55"><span class="cbox" id="cg166-t">Instead of trying to build several</span></div>
    <div id="cg167" class="cg clip" data-start="422.045" data-duration="1.575"><span class="cbox" id="cg167-t">factories at once,</span></div>
    <div id="cg168" class="cg clip" data-start="423.62" data-duration="1.7"><span class="cbox" id="cg168-t">let us first select one product</span></div>
    <div id="cg169" class="cg clip" data-start="425.32" data-duration="2.975"><span class="cbox" id="cg169-t">category and identify one committed local</span></div>
    <div id="cg170" class="cg clip" data-start="428.295" data-duration="1.41"><span class="cbox" id="cg170-t">business partner.</span></div>
    <div id="cg171" class="cg clip" data-start="429.705" data-duration="2.09"><span class="cbox" id="cg171-t">Together, we can define the required</span></div>
    <div id="cg172" class="cg clip" data-start="431.795" data-duration="3.84"><span class="cbox" id="cg172-t">equipment, examine possible Korean supply options,</span></div>
    <div id="cg173" class="cg clip" data-start="435.635" data-duration="1.25"><span class="cbox" id="cg173-t">and review the site,</span></div>
    <div id="cg174" class="cg clip" data-start="436.885" data-duration="2.0"><span class="cbox" id="cg174-t">utilities, market demand,</span></div>
    <div id="cg175" class="cg clip" data-start="438.885" data-duration="2.786"><span class="cbox" id="cg175-t">investment needs, and technical risks.</span></div>
    <div id="cg176" class="cg clip" data-start="441.671" data-duration="2.6"><span class="cbox" id="cg176-t">If the feasibility review is positive,</span></div>
    <div id="cg177" class="cg clip" data-start="444.271" data-duration="2.275"><span class="cbox" id="cg177-t">the parties can discuss a detailed</span></div>
    <div id="cg178" class="cg clip" data-start="446.546" data-duration="1.894"><span class="cbox" id="cg178-t">implementation plan.</span></div>
    <div id="cg179" class="cg clip" data-start="448.44" data-duration="3.315"><span class="cbox" id="cg179-t">A pilot does not guarantee commercial success.</span></div>
    <div id="cg180" class="cg clip" data-start="451.755" data-duration="1.75"><span class="cbox" id="cg180-t">However, it gives us a practical</span></div>
    <div id="cg181" class="cg clip" data-start="453.505" data-duration="2.175"><span class="cbox" id="cg181-t">way to test the opportunity before</span></div>
    <div id="cg182" class="cg clip" data-start="455.68" data-duration="3.152"><span class="cbox" id="cg182-t">considering a larger manufacturing program.</span></div>
    <div id="cg183" class="cg clip" data-start="461.137" data-duration="2.475"><span class="cbox" id="cg183-t">Industrial equipment transfer is the main</span></div>
    <div id="cg184" class="cg clip" data-start="463.612" data-duration="2.365"><span class="cbox" id="cg184-t">focus of today’s presentation,</span></div>
    <div id="cg185" class="cg clip" data-start="465.977" data-duration="3.925"><span class="cbox" id="cg185-t">but GPM also introduces five complementary</span></div>
    <div id="cg186" class="cg clip" data-start="469.902" data-duration="2.195"><span class="cbox" id="cg186-t">infrastructure business areas.</span></div>
    <div id="cg187" class="cg clip" data-start="472.097" data-duration="2.925"><span class="cbox" id="cg187-t">These include mobile solar cold storage,</span></div>
    <div id="cg188" class="cg clip" data-start="475.022" data-duration="2.725"><span class="cbox" id="cg188-t">solar cold-chain logistics terminals,</span></div>
    <div id="cg189" class="cg clip" data-start="477.747" data-duration="3.8"><span class="cbox" id="cg189-t">modular housing, refrigeration efficiency improvement,</span></div>
    <div id="cg190" class="cg clip" data-start="481.547" data-duration="2.732"><span class="cbox" id="cg190-t">and solar-powered EV charging.</span></div>
    <div id="cg191" class="cg clip" data-start="484.279" data-duration="1.85"><span class="cbox" id="cg191-t">These solutions may be relevant to</span></div>
    <div id="cg192" class="cg clip" data-start="486.129" data-duration="3.5"><span class="cbox" id="cg192-t">manufacturing sites, agricultural businesses,</span></div>
    <div id="cg193" class="cg clip" data-start="489.629" data-duration="3.619"><span class="cbox" id="cg193-t">logistics operators, and industrial facilities.</span></div>
    <div id="cg194" class="cg clip" data-start="493.248" data-duration="2.125"><span class="cbox" id="cg194-t">We present them as additional areas</span></div>
    <div id="cg195" class="cg clip" data-start="495.373" data-duration="2.225"><span class="cbox" id="cg195-t">for project-specific discussion,</span></div>
    <div id="cg196" class="cg clip" data-start="497.598" data-duration="3.075"><span class="cbox" id="cg196-t">not as completed installations or guaranteed</span></div>
    <div id="cg197" class="cg clip" data-start="500.673" data-duration="1.879"><span class="cbox" id="cg197-t">performance solutions.</span></div>
    <div id="cg198" class="cg clip" data-start="502.552" data-duration="1.925"><span class="cbox" id="cg198-t">If any of these opportunities relates</span></div>
    <div id="cg199" class="cg clip" data-start="504.477" data-duration="1.15"><span class="cbox" id="cg199-t">to your business,</span></div>
    <div id="cg200" class="cg clip" data-start="505.627" data-duration="3.159"><span class="cbox" id="cg200-t">we would welcome a separate technical conversation.</span></div>
    <div id="cg201" class="cg clip" data-start="511.113" data-duration="2.96"><span class="cbox" id="cg201-t">Let me close with a simple invitation.</span></div>
    <div id="cg202" class="cg clip" data-start="514.073" data-duration="2.2"><span class="cbox" id="cg202-t">If you are considering a manufacturing</span></div>
    <div id="cg203" class="cg clip" data-start="516.273" data-duration="1.49"><span class="cbox" id="cg203-t">business in Ghana,</span></div>
    <div id="cg204" class="cg clip" data-start="517.763" data-duration="1.1"><span class="cbox" id="cg204-t">we would like to hear about</span></div>
    <div id="cg205" class="cg clip" data-start="518.863" data-duration="2.4"><span class="cbox" id="cg205-t">your product, your business plans,</span></div>
    <div id="cg206" class="cg clip" data-start="521.263" data-duration="2.167"><span class="cbox" id="cg206-t">and the challenges you face.</span></div>
    <div id="cg207" class="cg clip" data-start="523.43" data-duration="1.175"><span class="cbox" id="cg207-t">You do not need to have</span></div>
    <div id="cg208" class="cg clip" data-start="524.605" data-duration="1.799"><span class="cbox" id="cg208-t">every answer today.</span></div>
    <div id="cg209" class="cg clip" data-start="526.404" data-duration="1.7"><span class="cbox" id="cg209-t">We can begin with a preliminary</span></div>
    <div id="cg210" class="cg clip" data-start="528.104" data-duration="3.1"><span class="cbox" id="cg210-t">discussion to understand your requirements and</span></div>
    <div id="cg211" class="cg clip" data-start="531.204" data-duration="3.05"><span class="cbox" id="cg211-t">assess whether suitable Korean equipment or</span></div>
    <div id="cg212" class="cg clip" data-start="534.254" data-duration="2.587"><span class="cbox" id="cg212-t">technical partners may be available.</span></div>
    <div id="cg213" class="cg clip" data-start="536.841" data-duration="3.0"><span class="cbox" id="cg213-t">We welcome conversations with manufacturers,</span></div>
    <div id="cg214" class="cg clip" data-start="539.841" data-duration="2.54"><span class="cbox" id="cg214-t">investors, business associations,</span></div>
    <div id="cg215" class="cg clip" data-start="542.381" data-duration="1.888"><span class="cbox" id="cg215-t">and technical partners.</span></div>
    <div id="cg216" class="cg clip" data-start="544.269" data-duration="2.057"><span class="cbox" id="cg216-t">Thank you for your attention.</span></div>
    <div id="cg217" class="cg clip" data-start="546.326" data-duration="2.175"><span class="cbox" id="cg217-t">We look forward to exploring practical</span></div>
