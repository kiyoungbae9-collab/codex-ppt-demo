  <div id="root" data-composition-id="s10" data-width="1920" data-height="1080">
    <div class="stage" id="s10-stage">
      <h1 class="title" id="s10-title">{{TITLE}}</h1>
      <div class="rule" id="s10-rule"></div>

  <script>
    const tl = gsap.timeline({ paused: true });
{{HELPERS}}
    const C = ["#s10-c1", "#s10-c2", "#s10-c3", "#s10-c4", "#s10-c5"];
    const N = ["#s10-n1", "#s10-n2", "#s10-n3", "#s10-n4", "#s10-n5"];
    const L = ["#s10-l1", "#s10-l2", "#s10-l3", "#s10-l4"];
    E.title();
    E.blurIn("#s10-msg", 0.85);
    // "We suggest beginning with a focused pilot project." -> the five-step roadmap waits, dimmed
    C.forEach((c, i) => E.blurIn(c + ", " + N[i], {{at:focused pilot project}} + i * 0.1, 0.45));
    E.dim(C.concat(N).join(", "), {{at:focused pilot project+0.9}}, 0.32);
    const step = (i, t) => {
      if (i > 0) { E.rest(C[i - 1], t); E.drawX(L[i - 1], t - 0.35, 0.4); }
      E.on(C[i], t);
      tl.to(N[i], { opacity: 1, backgroundColor: TEAL, color: WHITE, duration: 0.3, ease: "power2.inOut" }, t);
    };
    // "...let us first select one product category and identify one committed local business partner."
    step(0, {{at:select one product}});  E.ink("#s10-m1", {{at:select one product}});
    step(1, {{at:identify one committed}});  E.ink("#s10-m2", {{at:identify one committed}});
    // "Together, we can define the required equipment, examine possible Korean supply options, and review the site..."
    step(2, {{at:define the required equipment}});
    step(3, {{at:review the site}});  E.ink("#s10-m3", {{at:review the site}});
    // "If the feasibility review is positive, the parties can discuss a detailed implementation plan."
    step(4, {{at:detailed implementation plan}});
    // "A pilot does not guarantee commercial success. However, it gives us a practical way to test the opportunity
    //  before considering a larger manufacturing program."
    E.rest("#s10-c5", {{at:A pilot does not}});
    E.blurIn("#s10-p1", {{at:A pilot does not}});
    E.blurIn("#s10-d1", {{at:a practical way}}, 0.3);
    E.blurIn("#s10-p2", {{at:a practical way}});
    E.blurIn("#s10-d2", {{at:before considering}}, 0.3);
    E.blurIn("#s10-p3", {{at:before considering}});
    E.exit({{EXIT}});
    window.__timelines["s10"] = tl;
  </script>
